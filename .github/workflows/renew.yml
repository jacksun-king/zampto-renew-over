name: Zampto Auto Renew

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 02:00（北京时间 10:00）
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            google-chrome-stable \
            xvfb x11-utils xdotool scrot \
            fonts-noto-cjk fonts-noto-color-emoji

      - name: Install Python dependencies
        run: |
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: Setup proxy
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -n "$NODE_LINK" ]; then
            bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)
            echo "ALL_PROXY=http://127.0.0.1:1081" >> $GITHUB_ENV
            echo "HTTPS_PROXY=http://127.0.0.1:1081" >> $GITHUB_ENV
            echo "✅ 代理已启动"
          else
            echo "⚠️ NODE_LINK 未配置，直连模式"
          fi

      - name: Run renew script
        env:
          ZAMTO_COOKIE: ${{ secrets.ZAMTO_COOKIE }}
          ZAMPTO_EMAIL: ${{ secrets.ZAMPTO_EMAIL }}
          ZAMPTO_PASSWORD: ${{ secrets.ZAMPTO_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SERVER_ID: ${{ vars.SERVER_ID || '13421' }}
          ALL_PROXY: ${{ env.ALL_PROXY }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python app.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_id }}
          path: "*.png"
          retention-days: 3

      - name: Cleanup
        if: always()
        run: |
          pkill -f chromedriver 2>/dev/null || true
          pkill -f chrome 2>/dev/null || true
          pkill -f Xvfb 2>/dev/null || true
          pkill -f sing-box 2>/dev/null || true

      - name: Clean old workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Unset proxy so gh CLI can reach GitHub API
          unset ALL_PROXY HTTPS_PROXY HTTP_PROXY http_proxy https_proxy
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              gh run delete $run_id || true
            fi
          done